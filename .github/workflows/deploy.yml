name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]

# Prevent concurrent deploys to the same target
concurrency:
  group: deploy-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action != 'closed' }}

permissions:
  contents: read

jobs:
  # ── Preview: deploy ephemeral worker for each PR ──────────────────────────
  preview:
    name: Deploy Preview
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    environment: preview
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy preview worker
        id: deploy
        run: |
          WORKER_NAME="travis-lol-pr-${{ github.event.pull_request.number }}"
          OUTPUT=$(npx wrangler deploy \
            --name "$WORKER_NAME" \
            --compatibility-date 2026-05-17 \
            --compatibility-flags global_fetch_strictly_public \
            2>&1)
          echo "$OUTPUT"
          PREVIEW_URL=$(echo "$OUTPUT" | grep -oP 'https://[^\s]+\.workers\.dev' | head -1)
          echo "preview_url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"
          echo "worker_name=$WORKER_NAME" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

      - name: Comment preview URL on PR
        uses: actions/github-script@v7
        with:
          script: |
            const previewUrl = '${{ steps.deploy.outputs.preview_url }}';
            const workerName = '${{ steps.deploy.outputs.worker_name }}';
            const sha = context.sha.slice(0, 7);
            const body = [
              '## 🚀 Preview Deployed',
              '',
              `| | |`,
              `|---|---|`,
              `| **URL** | ${previewUrl || `https://${workerName}.<subdomain>.workers.dev`} |`,
              `| **Worker** | \`${workerName}\` |`,
              `| **Commit** | \`${sha}\` |`,
              '',
              '_Preview workers are torn down automatically when this PR is closed._'
            ].join('\n');

            // Update existing bot comment if present, otherwise create new
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.data.find(c =>
              c.user.type === 'Bot' && c.body.includes('Preview Deployed')
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  # ── Teardown: delete preview worker when PR closes ─────────────────────────
  teardown:
    name: Teardown Preview
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    environment: preview
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Delete preview worker
        run: |
          npx wrangler delete \
            --name "travis-lol-pr-${{ github.event.pull_request.number }}" \
            --force || echo "Worker not found or already deleted — skipping"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

  # ── Production: deploy on merge to main ────────────────────────────────────
  production:
    name: Deploy Production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
    permissions:
      contents: read
      deployments: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit (pre-deploy gate)
        run: npm audit --audit-level=moderate

      - name: Build
        run: npm run build

      - name: Skip deploy when Cloudflare token is missing
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: |
          echo "::warning::Cloudflare API token secret is not configured; skipping automatic deploy."
          echo "Set CF_API_TOKEN or CLOUDFLARE_API_TOKEN in the production environment to enable CI deploys."

      - name: Deploy to production
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler deploy --name travis-lol
