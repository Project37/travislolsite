# Gitleaks configuration
# https://github.com/gitleaks/gitleaks

title = "travislolsite gitleaks config"

[extend]
# Extend the default ruleset
useDefault = true

# Additional rules for Cloudflare and common patterns
[[rules]]
id = "cloudflare-api-token"
description = "Cloudflare API Token"
regex = '''(?i)(cloudflare[_-]?api[_-]?token|cf[_-]?api[_-]?token)\s*[:=]\s*["\']?([A-Za-z0-9_-]{40})["\']?'''
tags = ["cloudflare", "api-token"]

[[rules]]
id = "cloudflare-account-id"
description = "Cloudflare Account ID"
regex = '''(?i)(cloudflare[_-]?account[_-]?id|cf[_-]?account[_-]?id)\s*[:=]\s*["\']?([a-f0-9]{32})["\']?'''
tags = ["cloudflare", "account-id"]

[[rules]]
id = "wrangler-api-token"
description = "Wrangler API Token in config"
regex = '''api_token\s*=\s*["\']([A-Za-z0-9_-]{40})["\']'''
tags = ["cloudflare", "wrangler"]

[allowlist]
description = "Global allowlist"
paths = [
  # Lock files contain hashes that look like secrets
  "package-lock.json",
  "yarn.lock",
  "pnpm-lock.yaml",
  # Test fixtures
  "**/__tests__/**",
  "**/*.test.*",
  "**/*.spec.*",
]
